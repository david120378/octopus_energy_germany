# Octopus Energy – Kontoübersicht (Entities-Karte)
#
# Verwendung:
#   HA Dashboard → Karte hinzufügen → YAML-Editor → diesen Inhalt einfügen

type: entities
title: Octopus Energy
entities:
  - type: section
    label: Konto
  - entity: sensor.octopus_energy_deutschland_octopus_kontostand
    name: Kontostand
    icon: mdi:currency-eur
  - entity: sensor.octopus_energy_deutschland_octopus_uberfalliger_betrag
    name: Überfällig
    icon: mdi:alert-circle-outline

  - type: section
    label: Strom
  - entity: sensor.octopus_energy_deutschland_octopus_strom_zahlerstand
    name: Zählerstand (kumulativ)
    icon: mdi:counter
  - entity: sensor.octopus_energy_deutschland_octopus_verbrauch_monatlich
    name: Verbrauch aktueller Monat (kWh)
    icon: mdi:calendar-month
  - entity: sensor.octopus_energy_deutschland_octopus_verbrauch_jahrlich
    name: Verbrauch aktuelles Jahr (kWh)
    icon: mdi:calendar
  - entity: sensor.octopus_energy_deutschland_octopus_arbeitspreis
    name: Arbeitspreis
    icon: mdi:tag

  - type: section
    label: Kosten
  - entity: sensor.octopus_energy_deutschland_octopus_strom_kosten_aktueller_monat
    name: Aktueller Monat
  - entity: sensor.octopus_energy_deutschland_octopus_strom_kosten_aktuelles_jahr
    name: Aktuelles Jahr

  - type: section
    label: Letzte Rechnung
  - entity: sensor.octopus_energy_deutschland_octopus_letzte_rechnung_brutto
    name: Betrag (Brutto)
  - entity: sensor.octopus_energy_deutschland_octopus_letzte_rechnung_datum
    name: Datum

  - type: section
    label: System
  - entity: sensor.octopus_energy_deutschland_octopus_letzter_abruf
    name: Letzter Abruf
    icon: mdi:clock-outline
